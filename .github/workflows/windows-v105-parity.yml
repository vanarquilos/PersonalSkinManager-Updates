name: PSM v1.0.5 Windows source and frozen parity gates

on:
  push:
    branches:
      - release/v105-public-installer-staging
    paths:
      - ".github/workflows/windows-v105-parity.yml"
      - "injection/**"
      - "utils/**"
      - "main/**"
      - "native/cslol_stub/**"
      - "scripts/build_psm_cslol_stub.py"
      - "scripts/build_pyinstaller.py"
      - "scripts/build_v105_rose_style_frozen_private_qa.ps1"
      - "PersonalSkinManager.spec"
      - "installer.iss"
      - "config.py"
      - "requirements.txt"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psm-v105-windows-parity
  cancel-in-progress: true

jobs:
  windows-source-parity:
    name: Windows regression + compiled inert stub (NO release)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout source (no private binaries)
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned Python test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed" }

      - name: Syntax-check runtime and build scripts
        shell: pwsh
        run: |
          python -m compileall -q injection utils main scripts tests
          if ($LASTEXITCODE -ne 0) { throw "Python syntax check failed" }

      - name: Run source-vs-frozen and user-provided LTK regression gates
        shell: pwsh
        run: |
          python -m unittest -v tests.test_v105_user_ltk_provisioning tests.test_v105_rose_style_build_contract tests.test_v105_current_ltk_private_manifest tests.test_v105_current_ltk_build_contract tests.test_ltk_host_protocol tests.test_release_packaging tests.test_release_skin_routing tests.test_v105_frozen_external_dll_search tests.test_ltk_qa_runtime_selector tests.test_v105_hook_failure_details_contract
          if ($LASTEXITCODE -ne 0) { throw "Windows v1.0.5 regression tests failed" }

      - name: Compile PSM-owned inert CSLOL loader stub with MSVC
        shell: pwsh
        run: |
          $stubPath = Join-Path $env:RUNNER_TEMP "psm-v105-stub-test"
          New-Item -ItemType Directory -Path $stubPath -Force | Out-Null
          $env:PSM_LOCAL_STUB_OUTPUT_DIR = $stubPath
          python scripts/build_psm_cslol_stub.py
          if ($LASTEXITCODE -ne 0) { throw "PSM-owned inert CSLOL DLL stub failed compilation/export ABI check" }
          $manifest = Get-Content (Join-Path $stubPath "psm-cslol-stub-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.public_distribution_approved -ne $false) { throw "Release gate invalid" }
          Write-Host "MSVC inert DLL ABI and hash manifest checks passed"
          Write-Warning "No official LTK binaries, no game process, no installed PSM, and no gameplay success verified"
